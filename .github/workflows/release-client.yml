# HU-074 CA2: export Windows → .zip en itch.io (butler), a mano. El export Web también se genera como artefacto, pero /play
# lo publica deploy.yml en cada push a main (con la clave del host verificada), no este workflow.
# Secrets: BUTLER_API_KEY, ITCH_TARGET (usuario/juego:windows).
name: Publicar cliente

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL pública del servidor (https://juego.ejemplo.com)"
        required: true
      version:
        description: "Versión mostrada (p. ej. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    name: Exportar Web y Windows
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Plantillas de exportación
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true
      - name: Copiar contenido y mapas al cliente
        run: godot --path client --headless -s ../tools/sync_content.gd
      - name: Fijar URL del servidor por defecto
        env: { SERVER_URL: "${{ github.event.inputs.server_url }}" } # por env, no interpolado en el script
        run: |
          # Solo una URL https simple: cualquier otra cosa rompería el sed o metería código en settings.gd.
          echo "$SERVER_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?$' || { echo "server_url inválida: $SERVER_URL" >&2; exit 1; }
          sed -i "s|const DEFAULT_SERVER_URL := \".*\"|const DEFAULT_SERVER_URL := \"${SERVER_URL}\"|" client/autoload/settings.gd
      - name: Export Web
        run: |
          mkdir -p builds/web
          godot --path client --headless --export-release "Web" ../builds/web/index.html
      - name: Export Windows
        env: { VERSION: "${{ github.event.inputs.version }}" }
        run: |
          mkdir -p builds/windows
          godot --path client --headless --export-release "Windows Desktop" ../builds/windows/PixelRealms.exe
          cd builds && zip -r "PixelRealms-windows-${VERSION}.zip" windows
      - uses: actions/upload-artifact@v4
        with: { name: web, path: builds/web }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: builds/PixelRealms-windows-${{ github.event.inputs.version }}.zip

  publish-itch:
    name: Subir Windows a itch.io (página privada)
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows, path: dist }
      - name: butler push
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler
          ./butler push dist/*.zip "$ITCH_TARGET" --userversion "$VERSION"
