# HU-073 CA4: despliegue manual → construye la imagen del servidor, la sube a GHCR y actualiza el VPS por SSH.
# Secrets necesarios: VPS_HOST, VPS_USER, VPS_SSH_KEY (clave privada), opcional VPS_PATH (por defecto ~/pixelrealms).
name: Deploy servidor

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la imagen (por defecto el SHA corto)"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pixelrealms-server

jobs:
  build-push:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.sha }}" | cut -c1-44 >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tamaño de la imagen (< 150 MB, HU-073 CA1)
        run: |
          docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          docker image inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }} --format '{{.Size}}' | awk '{ printf "imagen: %.1f MB\n", $1/1024/1024; if ($1 > 150*1024*1024) { print "supera 150 MB"; exit 1 } }'

  deploy:
    name: Desplegar en el VPS
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copiar compose, Caddyfile y scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/Caddyfile,deploy/backup.sh,deploy/restore.sh"
          target: ${{ secrets.VPS_PATH || '~/pixelrealms' }}
      - name: Actualizar y reiniciar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH || '~/pixelrealms' }}
            test -f .env || { echo "Falta .env en el VPS (copiar de .env.example)"; exit 1; }
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sed -i "s|^SERVER_IMAGE=.*|SERVER_IMAGE=${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}|" .env
            grep -q '^SERVER_IMAGE=' .env || echo "SERVER_IMAGE=${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}" >> .env
            docker compose -f docker-compose.prod.yml pull server
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 5
            docker compose -f docker-compose.prod.yml exec -T caddy wget -qO- http://server:5080/health
